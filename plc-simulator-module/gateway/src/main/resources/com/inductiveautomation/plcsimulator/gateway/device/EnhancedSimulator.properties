# Enhanced PLC Simulator Device Driver
# i18n properties for device display in Ignition Gateway

# Device metadata - appears in device connection dropdown
EnhancedSimulator.Meta.DisplayName=Enhanced PLC Simulator
EnhancedSimulator.Meta.Description=Multi-vendor PLC simulator supporting Rockwell L5K, Siemens, Schneider, Beckhoff, and JSON formats with hierarchical tag structure

# Category names
GENERAL=General
PARSER=Parser Settings
SIMULATION=Simulation Settings

# General settings
EnhancedSimulator.General.DeviceName=Device Name
EnhancedSimulator.General.DeviceName.Desc=Unique name for this simulated PLC device
EnhancedSimulator.General.Enabled=Enabled
EnhancedSimulator.General.Enabled.Desc=Enable or disable this device connection

# Parser settings
EnhancedSimulator.Parser.FileContent=Upload PLC File
EnhancedSimulator.Parser.FileContent.Desc=Paste your PLC file content here, or use the file name field below to specify a file already on the Gateway
EnhancedSimulator.Parser.FileName=File Name
EnhancedSimulator.Parser.FileName.Desc=Original filename (e.g., 'DemoWWTP.L5K'). If file content is pasted above, this will be used to save the file. If empty, will look for existing file in /usr/local/bin/ignition/data/plc-simulator/
EnhancedSimulator.Parser.ParserType=Parser Type
EnhancedSimulator.Parser.ParserType.Desc=Select the PLC vendor/format
EnhancedSimulator.Parser.HotReload=Auto-reload on File Change
EnhancedSimulator.Parser.HotReload.Desc=Automatically reload tags when the PLC file is modified
EnhancedSimulator.Parser.ReloadInterval=Reload Check Interval
EnhancedSimulator.Parser.ReloadInterval.Desc=How often to check for file changes (seconds)

# Parser Type enum values
ROCKWELL=Rockwell L5k (Allen-Bradley)
JSON=Json Format
SIEMENS=Siemens Tia Portal
SCHNEIDER=Schneider Electric
BECKHOFF=Beckhoff Twincat

# Simulation settings
EnhancedSimulator.Simulation.Enabled=Enable Simulation
EnhancedSimulator.Simulation.Enabled.Desc=Enable dynamic value simulation for tags
EnhancedSimulator.Simulation.UpdateInterval=Update Interval
EnhancedSimulator.Simulation.UpdateInterval.Desc=How often to update simulated values (milliseconds)
EnhancedSimulator.Simulation.DefaultPattern=Default Simulation Pattern
EnhancedSimulator.Simulation.DefaultPattern.Desc=Default pattern for tags without explicit configuration

# Simulation Pattern enum values
STATIC=Static (No Changes)
SINE=Sine Wave
RAMP=Linear Ramp
RANDOM=Random Values
TOGGLE=Boolean Toggle

# Validation messages
EnhancedSimulator.Validation.DeviceNameRequired=Device name is required
EnhancedSimulator.Validation.FilePathRequired=PLC file path is required
EnhancedSimulator.Validation.FileNotFound=PLC file does not exist: {0}
EnhancedSimulator.Validation.FileNotReadable=PLC file is not readable: {0}
EnhancedSimulator.Validation.ParserTypeRequired=Parser type is required
EnhancedSimulator.Validation.UpdateIntervalMin=Update interval must be at least 100ms
EnhancedSimulator.Validation.ReloadIntervalMin=Reload interval must be at least 1 second
