<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC Simulator - Device Manager</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f3f4f6;
        }
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Load React from CDN (Ignition Gateway has these available) -->
    <script crossorigin src="/res/sys/js/react.js"></script>
    <script crossorigin src="/res/sys/js/react-dom.js"></script>

    <!-- Load our bundled app -->
    <script src="/res/plcsimulator/plc-simulator.js"></script>

    <script>
        // Get device name from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const deviceName = urlParams.get('device') || 'Unknown';

        // Mount the React app
        if (window.PLCSimulator && window.PLCSimulator.mount) {
            const container = document.getElementById('root');
            window.PLCSimulator.mount(container, { deviceName });
        } else {
            console.error('PLCSimulator not loaded');
            document.getElementById('root').innerHTML = '<h1 style="padding: 20px;">Error: PLC Simulator UI failed to load</h1>';
        }
    </script>
</body>
</html>
