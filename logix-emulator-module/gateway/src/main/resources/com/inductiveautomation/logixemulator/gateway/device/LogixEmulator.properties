# Logix PLC Emulator Device Driver
# i18n properties for device display in Ignition Gateway
# NOTE: Bundle name "LogixEmulator" is automatically prepended by BundleUtil for non-qualified keys

# Device metadata - appears in device connection dropdown
Meta.DisplayName=Logix PLC Emulator
Meta.Description=Rockwell Logix PLC emulator supporting L5K, L5X, JSON, and CSV formats with hierarchical tag structure

# Category names
GENERAL=General
PARSER=Parser Settings
SIMULATION=Simulation Settings

# General settings
General.DeviceName=Device Name
General.DeviceName.Desc=Unique name for this simulated PLC device
General.Enabled=Enabled
General.Enabled.Desc=Enable or disable this device connection

# Parser settings
Parser.FileContent=PLC File Content (Optional)
Parser.FileContent.Desc=OPTIONAL: Click 'Upload PLC File' button or paste content here. You can create the device first and add the file later. Device will show "Ready - Waiting for file upload" status.
Parser.FileName=File Name (Optional)
Parser.FileName.Desc=OPTIONAL: Filename to save as (e.g., 'DemoWWTP.L5K'). Auto-populated when uploading. Leave empty when creating device without a file.
Parser.ParserType=Parser Type
Parser.ParserType.Desc=Select the PLC vendor/format
Parser.HotReload=Auto-reload on File Change
Parser.HotReload.Desc=Automatically reload tags when the PLC file is modified
Parser.ReloadInterval=Reload Check Interval
Parser.ReloadInterval.Desc=How often to check for file changes (seconds)

# Parser Type enum values - THESE are what show in the dropdown!
# NOTE: These use full qualified class names, so NO bundle prefix is added
LogixEmulatorConfig.ParserType.ROCKWELL=Rockwell L5K (Allen-Bradley)
LogixEmulatorConfig.ParserType.JSON=JSON Format

# Simulation settings
Simulation.Enabled=Enable Simulation
Simulation.Enabled.Desc=Enable dynamic value simulation for tags
Simulation.UpdateInterval=Update Interval
Simulation.UpdateInterval.Desc=How often to update simulated values (milliseconds)
Simulation.DefaultPattern=Default Simulation Pattern
Simulation.DefaultPattern.Desc=Default pattern for tags without explicit configuration

# Simulation Pattern enum values
LogixEmulatorConfig.SimulationPattern.STATIC=Static (No Changes)
LogixEmulatorConfig.SimulationPattern.SINE=Sine Wave
LogixEmulatorConfig.SimulationPattern.RAMP=Linear Ramp
LogixEmulatorConfig.SimulationPattern.RANDOM=Random Values
LogixEmulatorConfig.SimulationPattern.TOGGLE=Boolean Toggle

# Validation messages
Validation.DeviceNameRequired=Device name is required
Validation.FilePathRequired=PLC file path is required
Validation.FileNotFound=PLC file does not exist: {0}
Validation.FileNotReadable=PLC file is not readable: {0}
Validation.ParserTypeRequired=Parser type is required
Validation.UpdateIntervalMin=Update interval must be at least 100ms
Validation.ReloadIntervalMin=Reload interval must be at least 1 second

# Gateway Config Menu
Tools.Logix PLC Emulator.EditProgram=Edit Program
