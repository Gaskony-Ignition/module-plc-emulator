name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        cache-dependency-path: 'logix-emulator-module/web-ui/yarn.lock'

    - name: Grant execute permission for gradlew
      run: chmod +x logix-emulator-module/gradlew

    - name: Build with Gradle
      working-directory: logix-emulator-module
      run: ./gradlew build --no-daemon --console=plain

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          logix-emulator-module/gateway/build/test-results/
          logix-emulator-module/gateway/build/reports/tests/
        retention-days: 30

    - name: Upload module artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ignition-module
        path: logix-emulator-module/build/*.modl
        retention-days: 90

    - name: Display build info
      if: success()
      run: |
        echo "Build completed successfully!"
        echo "Module artifacts:"
        ls -lh logix-emulator-module/build/*.modl || echo "No .modl files found"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security checks
      run: |
        echo "=== Security Scan ==="
        echo "Checking for hardcoded secrets..."

        # Check for potential hardcoded passwords (excluding templates, binaries, and build artifacts)
        if grep -rI "password\s*=\s*['\"]" logix-emulator-module --exclude="*.template" --exclude="gradle.properties" --exclude-dir=".git" --exclude-dir="build" --exclude-dir="node_modules" --exclude-dir=".gradle"; then
          echo "WARNING: Found potential hardcoded passwords"
          exit 1
        else
          echo "✓ No hardcoded passwords found"
        fi

        # Verify gradle.properties is not in git
        if git ls-files | grep -q "gradle.properties$"; then
          echo "ERROR: gradle.properties should not be committed!"
          exit 1
        else
          echo "✓ gradle.properties not in repository"
        fi

        echo "✓ Security checks passed"
