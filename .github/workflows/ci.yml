name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: 'web-ui/yarn.lock'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --console=plain

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results
        path: |
          gateway/build/test-results/
          gateway/build/reports/tests/
        retention-days: 30

    - name: Upload module artifact
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ignition-module
        path: build/*.modl
        retention-days: 90

    - name: Display build info
      if: success()
      run: |
        echo "Build completed successfully!"
        echo "Module artifacts:"
        ls -lh build/*.modl || echo "No .modl files found"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Run security checks
      run: |
        echo "=== Security Scan ==="
        echo "Checking for hardcoded secrets..."

        # Check for potential hardcoded passwords (excluding templates, binaries, and build artifacts)
        if grep -rI "password\s*=\s*['\"]" . --exclude="*.template" --exclude="gradle.properties" --exclude-dir=".git" --exclude-dir="build" --exclude-dir="node_modules" --exclude-dir=".gradle"; then
          echo "WARNING: Found potential hardcoded passwords"
          exit 1
        else
          echo "✓ No hardcoded passwords found"
        fi

        # Verify gradle.properties is not in git
        if git ls-files | grep -q "gradle.properties$"; then
          echo "ERROR: gradle.properties should not be committed!"
          exit 1
        else
          echo "✓ gradle.properties not in repository"
        fi

        echo "✓ Security checks passed"
