name: Build, Release & Publish to Portal

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./plc-simulator-module

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up module signing
        run: |
          SIGNING_DIR="${HOME}/.ignition-signing"
          mkdir -p "$SIGNING_DIR"
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > "$SIGNING_DIR/gaskony-keystore.jks"
          echo "${{ secrets.SIGNING_CERT }}" | base64 -d > "$SIGNING_DIR/gaskony-cert.pem"
          # Override sign.props to use secrets instead of in-repo certs
          cat > sign.props << EOF
          key.file=$SIGNING_DIR/gaskony-keystore.jks
          key.pass=${{ secrets.SIGNING_PASSWORD }}
          cert.file=$SIGNING_DIR/gaskony-cert.pem
          cert.alias=gaskony-module
          cert.pass=${{ secrets.SIGNING_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build module
        run: ./gradlew clean build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Find .modl file
        id: modl
        run: |
          MODL_FILE=$(find build -maxdepth 1 -name "EnhancedPLCSimulator-*.modl" ! -name "*.unsigned.modl" | head -1)
          echo "file=$MODL_FILE" >> $GITHUB_OUTPUT
          echo "Found: $MODL_FILE"

      - name: Create source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          gh release create "${{ github.ref_name }}" \
            "plc-simulator-module/${{ steps.modl.outputs.file }}" \
            --title "Enhanced PLC Simulator ${{ github.ref_name }}" \
            --generate-notes

      - name: Create portal release
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="plc-simulator-${{ github.ref_name }}"

          gh release delete "$TAG" --repo Gaskony-Ignition/ignition-modules-portal --yes 2>/dev/null || true
          gh api repos/Gaskony-Ignition/ignition-modules-portal/git/refs/tags/"$TAG" -X DELETE 2>/dev/null || true

          gh release create "$TAG" \
            "${{ steps.modl.outputs.file }}" \
            --repo Gaskony-Ignition/ignition-modules-portal \
            --title "Enhanced PLC Simulator v${VERSION}" \
            --notes "## Enhanced PLC Simulator v${VERSION}

          Simulate PLC devices with configurable tag structures for development and testing.

          ### Installation
          1. Download \`EnhancedPLCSimulator-${VERSION}.modl\` below
          2. Ignition Gateway: Config > System > Modules > Install or Upgrade
          3. Upload the .modl file

          **Requires:** Ignition 8.3+ | Java 17"

      - name: Update portal README
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
        working-directory: /tmp
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git clone https://x-access-token:${GH_TOKEN}@github.com/Gaskony-Ignition/ignition-modules-portal.git portal
          cd portal

          export VERSION
          python3 -c "
          import re, os
          VERSION = os.environ['VERSION']
          with open('README.md', 'r') as f:
              content = f.read()
          content = re.sub(r'EnhancedPLCSimulator-[\d.]+\.modl', f'EnhancedPLCSimulator-{VERSION}.modl', content)
          content = re.sub(r'plc-simulator-v[\d.]+', f'plc-simulator-v{VERSION}', content)
          content = re.sub(
              r'(### PLC Simulator.*?\*\*Latest Version\*\* \| v)[\d.]+',
              lambda m: m.group(1) + VERSION,
              content, flags=re.DOTALL, count=1
          )
          with open('README.md', 'w') as f:
              f.write(content)
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update PLC Simulator to v${VERSION}"
          git push
