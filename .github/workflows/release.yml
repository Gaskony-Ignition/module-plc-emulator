name: Build, Release & Publish to Portal

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./logix-emulator-module

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up module signing
        run: |
          SIGNING_DIR="${HOME}/.ignition-signing"
          mkdir -p "$SIGNING_DIR"
          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > "$SIGNING_DIR/gaskony-keystore.jks"
          echo "${{ secrets.SIGNING_CERT }}" | base64 -d > "$SIGNING_DIR/gaskony-cert.pem"
          # Create gradle.properties from template with CI signing secrets
          cp gradle.properties.template gradle.properties
          sed -i \
            -e "s|ignition.signing.keystoreFile=.*|ignition.signing.keystoreFile=$SIGNING_DIR/gaskony-keystore.jks|" \
            -e "s|ignition.signing.keystorePassword=.*|ignition.signing.keystorePassword=${{ secrets.SIGNING_PASSWORD }}|" \
            -e "s|ignition.signing.certFile=.*|ignition.signing.certFile=$SIGNING_DIR/gaskony-cert.pem|" \
            -e "s|ignition.signing.certAlias=.*|ignition.signing.certAlias=gaskony-module|" \
            -e "s|ignition.signing.certPassword=.*|ignition.signing.certPassword=${{ secrets.SIGNING_PASSWORD }}|" \
            gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build module
        run: ./gradlew clean build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Find .modl file
        id: modl
        run: |
          MODL_FILE=$(find build -maxdepth 1 -name "LogixPLCEmulator-*.modl" ! -name "*.unsigned.modl" | head -1)
          echo "file=$MODL_FILE" >> $GITHUB_OUTPUT
          echo "Found: $MODL_FILE"

      - name: Create source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          gh release create "${{ github.ref_name }}" \
            "logix-emulator-module/${{ steps.modl.outputs.file }}" \
            --title "Logix PLC Emulator ${{ github.ref_name }}" \
            --generate-notes

      - name: Create portal release
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="logix-emulator-${{ github.ref_name }}"

          gh release delete "$TAG" --repo Gaskony-Ignition/ignition-modules-portal --yes 2>/dev/null || true
          gh api repos/Gaskony-Ignition/ignition-modules-portal/git/refs/tags/"$TAG" -X DELETE 2>/dev/null || true

          gh release create "$TAG" \
            "${{ steps.modl.outputs.file }}" \
            --repo Gaskony-Ignition/ignition-modules-portal \
            --title "Logix PLC Emulator v${VERSION}" \
            --notes "## Logix PLC Emulator v${VERSION}

          Emulate Rockwell Logix PLC tag structures for development and testing.

          ### Installation
          1. Download \`LogixPLCEmulator-${VERSION}.modl\` below
          2. Ignition Gateway: Config > System > Modules > Install or Upgrade
          3. Upload the .modl file

          **Requires:** Ignition 8.3+ | Java 17"

      - name: Update portal README
        env:
          GH_TOKEN: ${{ secrets.PORTAL_TOKEN }}
        working-directory: /tmp
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git clone https://x-access-token:${GH_TOKEN}@github.com/Gaskony-Ignition/ignition-modules-portal.git portal
          cd portal

          export VERSION
          python3 -c "
          import re, os
          VERSION = os.environ['VERSION']
          with open('README.md', 'r') as f:
              content = f.read()
          content = re.sub(r'LogixPLCEmulator-[\d.]+\.modl', f'LogixPLCEmulator-{VERSION}.modl', content)
          content = re.sub(r'logix-emulator-v[\d.]+', f'logix-emulator-v{VERSION}', content)
          content = re.sub(
              r'(### Logix PLC Emulator.*?\*\*Latest Version\*\* \| v)[\d.]+',
              lambda m: m.group(1) + VERSION,
              content, flags=re.DOTALL, count=1
          )
          content = re.sub(
              r'(\| Logix PLC Emulator\s*\| v)[\d.]+',
              lambda m: m.group(1) + VERSION,
              content
          )
          with open('README.md', 'w') as f:
              f.write(content)
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update Logix PLC Emulator to v${VERSION}"
          git push
