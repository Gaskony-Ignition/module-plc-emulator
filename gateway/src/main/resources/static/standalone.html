<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logix PLC Emulator - Ignition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { width: 100%; height: 100%; overflow: hidden; }
        body { background: #11111b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React UMD libraries (copied during build) -->
    <script src="/res/logixemulator/react.production.min.js"></script>
    <script src="/res/logixemulator/react-dom.production.min.js"></script>

    <!-- Bridge React globals for UMD module -->
    <script>
        window.react = window.React;
        window["react-dom"] = window.ReactDOM;
    </script>

    <!-- Logix PLC Emulator UMD module -->
    <script src="/res/logixemulator/LogixConnectionBrowser.js"></script>

    <!-- Mount React app -->
    <script>
        ReactDOM.createRoot(document.getElementById('root'))
            .render(React.createElement(LogixConnectionBrowser.LogixConnectionBrowser));
    </script>
</body>
</html>
