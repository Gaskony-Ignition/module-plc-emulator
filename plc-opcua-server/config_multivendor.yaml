# PLC OPC-UA Simulator - Multi-Vendor Configuration
# Demonstrates JSON parser + Rockwell parser on same server

server:
  endpoint: "opc.tcp://0.0.0.0:4840/plc-simulator/"
  name: "Multi-Vendor PLC Simulator"
  namespace: "http://plc-simulator.opcua"
  hot_reload: true
  reload_interval: 5

# Multiple PLCs from different vendors
plcs:
  # JSON-based test PLC
  - name: "DemoPlant"
    enabled: true
    file: "../example_plc.json"
    parser: "json"
    simulation:
      enabled: true
      update_interval: 1.0
      rules:
        # Pump simulations
        "Pump1.Speed":
          type: "ramp"
          min: 0
          max: 100
          step: 2.0

        "Pump2.Speed":
          type: "sine"
          min: 0
          max: 100
          period: 30

        "Pump1.Running":
          type: "toggle"
          interval: 15

        "Pump2.Running":
          type: "toggle"
          interval: 20

        # Tank levels
        "Tank1.Level":
          type: "sine"
          min: 20
          max: 80
          period: 60

        "Tank2.Level":
          type: "ramp"
          min: 0
          max: 100
          step: 0.5

        # Temperatures
        "Temperature*.Scaled":
          type: "noise"
          amplitude: 2.0
          min: 20
          max: 30

        # Pressures
        "Pressure*.Scaled":
          type: "sine"
          min: 10
          max: 20
          period: 45

  # Rockwell L5K PLC (if available)
  - name: "DemoWWTP"
    enabled: false  # Set to true if L5K file exists
    file: "../DemoWWTP-sample-a.L5K"
    parser: "rockwell"
    parser_options:
      select_tags: true
      allow_hidden: false
      use_stored_values: true
    simulation:
      enabled: true
      update_interval: 1.0
      rules:
        "AI_DOP201_DATA.PV":
          type: "ramp"
          min: 0
          max: 100
          step: 0.5

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    path: "opcua_simulator.log"
    max_bytes: 10485760
    backup_count: 5

# Security (for future implementation)
security:
  enabled: false
